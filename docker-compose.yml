services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: route_optimizer_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: route_optimizer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d route_optimizer"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
