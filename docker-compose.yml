services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: route_optimizer_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-route_optimizer}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d route_optimizer"]
      interval: 5s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: route_optimizer_ml
    restart: unless-stopped
    ports:
      - "8001:8001"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: route_optimizer_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_started
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-route_optimizer}?sslmode=disable
      HTTP_PORT: "8080"
      HTTP_HOST: "0.0.0.0"
      AUTO_MIGRATE: "true"
      MIGRATIONS_DIR: "./migrations"
      TWOGIS_API_KEY: ${TWOGIS_API_KEY:-}
      ML_BASE_URL: http://ml-service:8001
      ML_SERVICE_URL: http://ml-service:8001
      OSRM_BASE_URL: https://router.project-osrm.org
      OSRM_URL: https://router.project-osrm.org
      LOG_LEVEL: info
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: route_optimizer_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
