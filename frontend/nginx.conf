server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ { proxy_pass http://backend:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location /health { proxy_pass http://backend:8080/health; }
  location ~* \.(css|js)$ { add_header Cache-Control "no-cache, must-revalidate"; try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
