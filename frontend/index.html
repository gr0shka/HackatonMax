<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff0ab"><title>Go! — умные прогулки</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""><link rel="stylesheet" href="styles.css"></head>
<body><main class="app-shell">
<header class="topbar"><button class="brand">Go! <span>⌁</span></button><div class="status-pill"><i></i><span>AI-маршрут</span></div><button class="icon-button" id="locateButton" aria-label="Моё местоположение">⌖</button></header>
<section class="map-wrap"><div id="map"></div><div class="map-hint" id="mapHint">Нажмите на карту: сначала старт, затем финиш</div><div class="route-summary hidden" id="routeSummary"><strong id="summaryTime">—</strong><span id="summaryDistance">—</span></div></section>
<section class="planner" id="planner"><button class="grabber" id="togglePlanner"><span>⌄</span></button>
<form id="routeForm"><div class="section-title"><span>Путь</span><small>Можно выбрать точки на карте</small></div>
<label class="route-field start-field"><span>Откуда</span><input id="startInput" value="ул. Достоевского, 64, Уфа" required><button type="button" data-pick="start">◎</button></label>
<label class="route-field finish-field"><span>Куда</span><input id="finishInput" value="ул. Цюрупы, 80, Уфа" required><button type="button" data-pick="finish">◎</button></label>
<div class="form-row"><div><div class="section-title"><span>Время</span></div><div class="time-fields"><input id="timeFrom" type="time" value="13:15"><input id="timeTo" type="time" value="15:15"></div></div><div><div class="section-title"><span>Темп</span></div><div class="segmented" id="pacePicker"><button type="button" data-pace="relaxed">Спокойно</button><button type="button" class="active" data-pace="normal">Обычно</button><button type="button" data-pace="fast">Быстро</button></div></div></div>
<div class="section-title"><span>Пожелания</span><small>Выберите несколько</small></div><div class="chips" id="interestPicker"><button type="button" data-interest="sightseeing" class="active">🏛 Посетить</button><button type="button" data-interest="art">🖼 Музеи</button><button type="button" data-interest="parks" class="active">🌿 Отдых</button><button type="button" data-interest="souvenir">🎁 Сувениры</button><button type="button" data-interest="coffee">☕ Кофе</button><button type="button" data-interest="food">🍜 Поесть</button></div>
<div class="action-row"><p id="formMessage" role="status">Маршрут подберёт места под ваши интересы</p><button class="go-button" id="goButton" type="submit"><span>Go!</span><i>→</i></button></div></form>
<section class="results hidden" id="results"><div class="result-head"><div><small>ВАШ МАРШРУТ</small><h2 id="resultTitle">Прогулка готова</h2></div><button id="editButton">Изменить</button></div><div class="reasons" id="reasons"></div><ol class="waypoints" id="waypoints"></ol></section>
</section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script><script src="app.js"></script></body></html>
